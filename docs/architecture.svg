<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="How a trip request moves from the client's browser to the Google Sheet">
  <title>How a trip request moves through the system</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1F3A5F">
    <!-- 1 browser -->
    <rect x="20" y="95" width="170" height="120" rx="10" fill="#DCEBFA" stroke="#1F3A5F" stroke-width="2"/>
    <text x="105" y="125" text-anchor="middle" font-weight="700">1. Client's browser</text>
    <text x="105" y="150" text-anchor="middle" font-size="12">Trip request form</text>
    <text x="105" y="168" text-anchor="middle" font-size="12">13 languages</text>
    <text x="105" y="186" text-anchor="middle" font-size="12">No passport or card numbers</text>

    <!-- 2 worker -->
    <rect x="260" y="55" width="210" height="200" rx="10" fill="#DCEBFA" stroke="#1F3A5F" stroke-width="2"/>
    <text x="365" y="85" text-anchor="middle" font-weight="700">2. Cloudflare Worker</text>
    <text x="365" y="112" text-anchor="middle" font-size="12">Turnstile bot check</text>
    <text x="365" y="132" text-anchor="middle" font-size="12">Checks every answer on the server</text>
    <text x="365" y="152" text-anchor="middle" font-size="12">Rate limits repeat sends</text>
    <text x="365" y="172" text-anchor="middle" font-size="12">Flags text that tries to give</text>
    <text x="365" y="188" text-anchor="middle" font-size="12">instructions to an AI</text>
    <text x="365" y="212" text-anchor="middle" font-size="12">Keys are Worker secrets,</text>
    <text x="365" y="228" text-anchor="middle" font-size="12">never in this repository</text>

    <!-- 3 sheet -->
    <rect x="540" y="95" width="170" height="120" rx="10" fill="#DFF2E1" stroke="#1E5C2A" stroke-width="2"/>
    <text x="625" y="125" text-anchor="middle" font-weight="700" fill="#1E5C2A">3. Google Sheet</text>
    <text x="625" y="150" text-anchor="middle" font-size="12" fill="#1E5C2A">One row per request</text>
    <text x="625" y="168" text-anchor="middle" font-size="12" fill="#1E5C2A">Written as plain text only</text>
    <text x="625" y="186" text-anchor="middle" font-size="12" fill="#1E5C2A">(never run as a formula)</text>

    <!-- 4 private -->
    <rect x="760" y="95" width="125" height="120" rx="10" fill="#F3F3F3" stroke="#777" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="822" y="125" text-anchor="middle" font-weight="700" fill="#444">4. Fare report</text>
    <text x="822" y="150" text-anchor="middle" font-size="12" fill="#444">Private, run locally,</text>
    <text x="822" y="168" text-anchor="middle" font-size="12" fill="#444">not part of this</text>
    <text x="822" y="186" text-anchor="middle" font-size="12" fill="#444">repository</text>

    <line x1="190" y1="155" x2="256" y2="155" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arr)"/>
    <line x1="470" y1="155" x2="536" y2="155" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#arr)"/>
    <line x1="710" y1="155" x2="756" y2="155" stroke="#777" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>

    <text x="450" y="300" text-anchor="middle" font-size="12" fill="#444">The code in this repository covers steps 1 to 3: the form and the Worker.</text>
  </g>
</svg>
